# Add a NEW Nginx server block, do not overwrite an existing site.
# Replace this domain after creating its Cloudflare DNS A record.
server {
    listen 80;
    listen [::]:80;
    server_name fanscope-api.example.com;

    client_max_body_size 12m;
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 12s;
        proxy_read_timeout 180s;
    }
}
# After nginx -t and reload, run certbot --nginx -d fanscope-api.example.com
# to obtain HTTPS. If you use Cloudflare orange-cloud proxy, first issue
# the certificate with DNS-only, then switch to Full (strict).
