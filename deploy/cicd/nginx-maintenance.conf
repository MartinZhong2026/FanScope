# Include INSIDE the FanScope server {} only. Do not add to other projects.
# health is read-only and remains available for the public post-deploy probe.
set $fanscope_maintenance 0;
if (-f /var/lib/fanscope-cd/maintenance) { set $fanscope_maintenance 1; }
if ($uri = /api/health) { set $fanscope_maintenance 0; }
if ($fanscope_maintenance = 1) { return 503; }
