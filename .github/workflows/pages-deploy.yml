name: FanScope Pages deploy
on:
  workflow_run:
    workflows: [FanScope checks]
    types: [completed]
  workflow_dispatch:
    inputs:
      operation:
        description: Read-only preflight, or explicitly roll back production
        required: true
        type: choice
        default: inspect
        options: [inspect, rollback]
      deployment_id:
        description: Existing successful production Pages deployment UUID to roll back to
        required: false
        type: string
permissions:
  contents: read
concurrency:
  # Production and rollback serialize together. Preview branches have their own
  # queues and cannot replace a pending production deployment.
  group: ${{ (github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'push') && 'fanscope-pages-production' || format('fanscope-pages-preview-{0}-{1}', github.event.workflow_run.head_repository.id, github.event.workflow_run.head_branch) }}
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' ||
       (vars.PAGES_CD_ENABLED == 'true' && github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.repository.full_name == github.repository &&
        github.event.workflow_run.path == '.github/workflows/test.yml' &&
        ((github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.pull_requests[0].base.ref == 'main') ||
         (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'))))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: read
    environment: ${{ (github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'push') && 'pages-production' || 'pages-preview' }}
    steps:
      # Always trusted main code. No PR checkout/npm lifecycle/PR shell commands here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      # Validate first: stale/stacked/backend-only sources end here as a green
      # skip, before installing anything. Untrusted sources still fail.
      - name: Validate source run and reject stale releases
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PATH: ${{ github.event_path }}
        run: node scripts/cicd/pages-source.mjs
      - run: npm ci --ignore-scripts --prefix deploy/pages
        if: github.event_name != 'workflow_dispatch' && steps.source.outputs.mode != 'skip'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: github.event_name != 'workflow_dispatch' && steps.source.outputs.mode != 'skip'
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          name: ${{ steps.source.outputs.artifact }}
          path: dist/${{ steps.source.outputs.mode }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.source.outputs.mode == 'preview'
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          name: mobile-app-experience
          path: work/preview-evidence
      - name: Inspect deployment channel, publish, verify, and roll back on failure
        if: steps.source.outputs.mode != 'skip'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_CURRENT_DEPLOYMENT_ID: ${{ vars.PAGES_CURRENT_DEPLOYMENT_ID }}
          PAGES_PROJECT: ${{ steps.source.outputs.project }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
          PR_NUMBER: ${{ steps.source.outputs.pr }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          WRANGLER_SEND_METRICS: 'false'
          PAGES_ACTION: ${{ github.event_name == 'workflow_dispatch' && inputs.operation || 'deploy' }}
        run: node scripts/cicd/pages.mjs "$PAGES_ACTION"
