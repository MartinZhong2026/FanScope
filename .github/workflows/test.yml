name: FanScope checks
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
permissions:
  contents: read
concurrency:
  # Only test runs share this group; deployment workflows use separate groups.
  group: fanscope-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node scripts/cicd/build-pages.mjs
        env:
          RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: node scripts/cicd/build-pages.mjs --preview
        env:
          RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: python3 -m unittest discover -s scripts/cicd/tests -v
      - run: bash -n scripts/ci-fixture-server.sh deploy/cicd/install-host.sh
      - run: docker build --label org.opencontainers.image.revision=${{ github.sha }} --build-arg FANSCOPE_COMMIT=${{ github.sha }} -t fanscope-ci:${{ github.sha }} -f api/Dockerfile api
      - name: Real Docker release and rollback rehearsal on synthetic data
        run: python3 scripts/cicd/docker_rehearsal.py fanscope-ci:${{ github.sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pages-production
          path: dist/production
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pages-preview
          path: dist/preview
          retention-days: 7
          if-no-files-found: error
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y unzip poppler-utils
      - run: npm ci --ignore-scripts
        working-directory: api
      - run: npm test
        working-directory: api
      - run: node scripts/check-sensitive.mjs
      - run: git diff --check
      - run: npm audit --omit=dev
        working-directory: api
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
        working-directory: api
      - run: python -m pip install playwright==1.62.0
      - run: python -m playwright install --with-deps chromium webkit
      - name: Mobile browser acceptance against isolated fixtures
        run: |
          bash scripts/ci-fixture-server.sh start mobile api/test/mobile-browser-server.mjs
          python scripts/bilingual-browser-acceptance.py --webkit --output work/bilingual-browser
          python scripts/mobile-browser-acceptance.py --webkit --output work/mobile-browser-results
          python scripts/dark-reference-acceptance.py --output work/dark-reference
      - name: Publication, evidence and batch browser acceptance
        run: |
          # Stop only this job's recorded fixture, then use a new isolated database.
          bash scripts/ci-fixture-server.sh stop mobile
          bash scripts/ci-fixture-server.sh start quality api/test/quality-browser-server.mjs
          python scripts/quality-browser-acceptance.py --output work/quality-browser
          python scripts/quality-browser-acceptance.py --language en --output work/quality-browser-en
      - name: Real Chinese metadata and separate-market browser acceptance
        run: |
          bash scripts/ci-fixture-server.sh stop quality
          bash scripts/ci-fixture-server.sh start chinese api/test/chinese-browser-server.mjs
          python scripts/chinese-browser-acceptance.py --output work/chinese-browser
      - name: Fixture server logs on failure
        if: failure()
        run: |
          shopt -s nullglob
          logs=(work/*-server.log)
          if [ "${#logs[@]}" -eq 0 ]; then echo "No fixture server logs were produced."; fi
          for f in "${logs[@]}"; do echo "::group::$f"; cat "$f"; echo "::endgroup::"; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mobile-app-experience
          path: |
            work/mobile-browser-results
            work/dark-reference
            work/mobile-server.log
            work/quality-server.log
            work/quality-browser
            work/quality-browser-en
            work/bilingual-browser
            work/chinese-server.log
            work/chinese-browser
  required:
    if: always()
    needs: [api, mobile, build]
    runs-on: ubuntu-24.04
    steps:
      - name: All required checks passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 -c 'import json,os; r=json.loads(os.environ["RESULTS"]); assert all(j["result"]=="success" for j in r.values()), r'
